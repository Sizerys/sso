syntax = "proto3";

package auth;

option go_package = "sso/protos/gen/go/sso/ssov1";

service Auth{ 
    rpc Register (RegisterRequest) returns (RegisterResponse);
    rpc Login (LoginRequest) returns (LoginResponse);
    rpc Logout (LogoutRequest) returns (LogoutResponse);
    rpc LogoutAll (LogoutAllRequest) returns (LogoutAllResponse);
    rpc Refresh  (RefreshRequest)  returns (RefreshResponse);
    
}

message RegisterRequest {
    string email = 1;
    string user_password = 2;
}  

message RegisterResponse {
    int64 user_id = 1;
}

message LoginRequest {
    string email = 1;
    string user_password = 2;
    int32 app_id = 3;
}

message LoginResponse {
    string access_token = 1;
    string refresh_token = 2;
}

message LogoutRequest {
    string refresh_token = 1;
}

message LogoutResponse {
}

message LogoutAllRequest {}
message LogoutAllResponse {}

message RefreshRequest {
    string refresh_token = 1;
    int32  app_id        = 2;
}

message RefreshResponse {
    string access_token  = 1;
    string refresh_token = 2;
}

// protoc -I protos/proto protos/proto/sso/sso.proto --go_out=./protos/gen/go/sso --go_opt=paths=source_relative --go-grpc_out=./protos/gen/go/sso --go-grpc_opt=paths=source_relative